# DungeonRooms Configuration
# ----------------------------
# Version: 2.3.1
# Author: evnrca
# GitHub: https://github.com/evnrca/DungeonRooms
# This file controls denial behavior, progress display, border visualization, and messages.
# After editing, run /dr reload to apply changes.
# Dungeon setup (boundary, spawn, rooms) is stored in dungeons.json, NOT in this file.
# Player progress is stored in playerdata.json.

# Progress reset behavior - when to reset player dungeon progress
# Set to true to enable reset on each condition
progress-reset:
  # Reset on player death
  death: false
  # Reset when leaving the dungeon region
  dungeon-exit: true
  # Reset when changing worlds
  world-change: true
  # Reset on teleport (including commands)
  teleport: true

# Dungeon death override - prevents vanilla death while inside a registered dungeon
death-override:
  enabled: true
  # Blindness duration after fake death, in seconds
  blindness-seconds: 5
  title: '&c&lYOU DIED'
  subtitle: '&7Returning to dungeon spawn...'
  chat-message: '&cYou died in &4{dungeon}&c and were returned to the dungeon spawn.'
  # Broadcast message to nearby/global chat. Leave empty to disable.
  broadcast-message: '&7{player} died in dungeon &c{dungeon}&7.'
  penalties:
    # Drop all player inventory items at the death location
    drop-items: false
    # Drop all player experience at the death location
    drop-exp: false
  # Console commands run after a dungeon death. Placeholders: {player}, {uuid}, {dungeon}, {world}, {x}, {y}, {z}
  commands: []

# Denial settings when a player tries to enter a locked room
denial:
  # Action when denied: KNOCKBACK, VELOCITY, TELEPORT, or CANCEL
  action: KNOCKBACK
  # Velocity pushback for KNOCKBACK/VELOCITY
  velocity:
    horizontal: 1.5
    vertical: 0.4
  # Title/subtitle shown on denial (supports MiniMessage/legacy color codes)
  title: '&b&lROOM LOCKED!'
  subtitle: '&bKill &3{remaining} &bmore mobs to proceed.'
  # Sound played on denial
  sound: ENTITY_VILLAGER_NO
  sound-volume: 1.0
  sound-pitch: 1.0

# Progress display settings (shown while inside a dungeon room)
progress-display:
  action-bar:
    enabled: true
    format: '&bProgress: &3{current}/{required} &bmobs killed'
  chat:
    enabled: true
    format: '&bProgress: &3{current}/{required} &bmobs killed'
    # Cooldown in seconds between chat progress messages
    cooldown: 5

# Border visualization - shows particle outlines of the current room region
border-visualizer:
  enabled: true
  # Particle type (any Bukkit Particle enum name, e.g., FLAME, REDSTONE, END_ROD)
  particle-type: FLAME
  # Particle type for spawn region borders
  spawn-particle-type: END_ROD
  # Particle type for dungeon boundary borders
  dungeon-particle-type: END_ROD
  # Particles per block along the border
  particle-density: 0.5
  # Update interval in ticks (20 ticks = 1 second)
  interval-ticks: 20
  messages:
    toggled-on: '&bBorder visualization &3enabled.'
    toggled-off: '&bBorder visualization &3disabled.'
    not-in-region: '&cYou are not inside any registered dungeon room.'
    feature-disabled: '&cBorder visualization is disabled by the server.'
    spawn-toggled-on: '&bSpawn border visualization &3enabled.'
    spawn-toggled-off: '&bSpawn border visualization &3disabled.'

# Message templates (support MiniMessage/legacy color codes and placeholders)
messages:
